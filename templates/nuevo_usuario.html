{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm p-4">

                <h2 class="fw-bold mb-4">
                    👤 Nuevo usuario
                </h2>

                {% if error %}

                <div class="alert alert-danger">

                    {{ error }}

                </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Rol
                        </label>

                        <select
                            name="rol"
                            class="form-select"
                            required
                        >

                            <option value="Cajero">
                                Cajero
                            </option>

                            <option value="Admin">
                                Administrador
                            </option>

                        </select>

                    </div>


                    <div class="d-flex gap-2">

                        <a
                            href="/usuarios/"
                            class="btn btn-secondary w-50"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary w-50"
                        >
                            <i class="fas fa-save"></i>
                            Crear usuario
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
