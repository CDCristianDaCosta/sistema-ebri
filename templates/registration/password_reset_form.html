
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | E-BRI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card shadow border-0 rounded-4 p-4" style="width:100%;max-width:450px;">
    <h3 class="text-center mb-3">🔐 Recuperar contraseña</h3>
    <p class="text-muted text-center">Ingresá el correo electrónico asociado a tu usuario.</p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_email" class="form-label">Correo electrónico</label>
            <input
                type="email"
                name="email"
                id="id_email"
                class="form-control"
                autocomplete="email"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Enviar instrucciones
        </button>
    </form>

    <a href="{% url 'login' %}" class="text-center mt-3">Volver al inicio de sesión</a>
</div>

</body>
</html>
